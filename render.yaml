services:
  - type: web
    name: open-list
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: hosted_openai_compatible
      - key: OPENAI_COMPATIBLE_BASE_URL
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_MODEL
        value: google/gemma-2-9b-it
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: open_list_db
      - key: VECTOR_SEARCH_INDEX_NAME
        value: vector_index
      - key: CORS_ORIGINS
        value: "*"
