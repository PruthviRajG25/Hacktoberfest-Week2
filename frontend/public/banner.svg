<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#311042" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-primary" cx="60%" cy="40%" r="55%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-accent" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logo-badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="text-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Background Ambience -->
  <rect width="1200" height="630" fill="url(#glow-primary)" />
  <rect width="1200" height="630" fill="url(#glow-accent)" />
  <rect width="1200" height="630" fill="url(#grid-pattern)" />

  <!-- Decorative Modern Circles -->
  <circle cx="1060" cy="180" r="280" stroke="#818cf8" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="1060" cy="180" r="200" stroke="#c084fc" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="1060" cy="180" r="120" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1" />

  <!-- Brand Pill / Top Badge -->
  <g transform="translate(80, 72)">
    <rect width="320" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="36" y="23" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">OPEN-WEIGHT AI • GEMMA 3 1B</text>
  </g>

  <!-- Main Unified Brand Lockup (Logo + Title) -->
  <g transform="translate(80, 138)">
    <!-- 80x80 Logo Mark -->
    <rect width="80" height="80" rx="22" fill="url(#logo-badge-grad)" />
    <rect x="1" y="1" width="78" height="78" rx="21" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Tag Sheet inside logo -->
    <path d="M25 28C25 24.6863 27.6863 22 31 22H47.1716C48.7629 22 50.2893 22.6321 51.4142 23.7574L58.2426 30.5858C59.3679 31.7107 60 33.2371 60 34.8284V52C60 55.3137 57.3137 58 54 58H31C27.6863 58 25 55.3137 25 52V28Z" fill="#ffffff" />
    <!-- Tag Eyelet -->
    <circle cx="37" cy="32" r="3.5" fill="#7c3aed" />
    <circle cx="37" cy="32" r="1.8" fill="#ffffff" />
    <!-- Listing Lines -->
    <rect x="32" y="40" width="22" height="3.2" rx="1.6" fill="#6366f1" />
    <rect x="32" y="46.5" width="17" height="3.2" rx="1.6" fill="#818cf8" />
    <rect x="32" y="53" width="11" height="3" rx="1.5" fill="#c7d2fe" />

    <!-- AI Sparkle on Logo -->
    <path d="M64 15C64 21.075 59.075 26 53 26C59.075 26 64 30.925 64 37C64 30.925 68.925 26 75 26C68.925 26 64 21.075 64 15Z" fill="#38bdf8" />
    <circle cx="64" cy="26" r="1.8" fill="#ffffff" />

    <!-- Brand Typography beside logo -->
    <text x="104" y="52" font-family="'Inter', system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Open List</text>
    <text x="328" y="52" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">STUDIO</text>
  </g>

  <!-- Big Hero Headline -->
  <text x="80" y="278" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
    AI-Powered Ecommerce Listing Generator
  </text>
  <text x="80" y="328" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#text-glow-grad)" letter-spacing="-0.5">
    Strictly Fact-Grounded • SEO Optimized • Multi-Channel
  </text>

  <!-- Subtitle Paragraph -->
  <text x="80" y="380" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Engineered for Etsy Artisans, eBay Sellers, Instagram Boutiques &amp; Local Retailers.
  </text>
  <text x="80" y="412" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Generate titles, bullet highlights, search tags, social captions &amp; clean multi-format exports.
  </text>

  <!-- Tech Pillars Bottom Grid -->
  <g transform="translate(80, 470)">
    <!-- Pillar 1: Gemma 3 -->
    <rect width="230" height="88" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="24" y="36" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1">LOCAL INFERENCE</text>
    <text x="24" y="64" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Gemma 3 1B</text>

    <!-- Pillar 2: MongoDB Atlas -->
    <rect x="250" width="230" height="88" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="274" y="36" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">PERSISTENCE &amp; VECTOR</text>
    <text x="274" y="64" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">MongoDB Atlas</text>

    <!-- Pillar 3: Anti-Hallucination Guardrails -->
    <rect x="500" width="250" height="88" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="524" y="36" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1">ACCURACY SHIELD</text>
    <text x="524" y="64" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Factual Guardrails</text>

    <!-- Pillar 4: Channels -->
    <rect x="770" width="270" height="88" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="794" y="36" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="1">TARGET CHANNELS</text>
    <text x="794" y="64" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Etsy • eBay • Instagram</text>
  </g>

  <!-- Bottom Copyright / Version bar -->
  <line x1="80" y1="590" x2="1120" y2="590" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="80" y="612" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">
    Open List © 2026 • Open-Weight AI Architecture • Production Ready
  </text>
</svg>
