  <text x="124" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="22" font-weight="800" fill="url(#ol-text-grad)" letter-spacing="-0.5">List</text>

  <!-- Subtitle / Tagline -->
  <text x="65" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="0.3">AI ECOMMERCE LISTING GENERATOR</text>
