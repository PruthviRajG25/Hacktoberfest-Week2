    <!-- List Lines -->
    <rect x="19" y="24" width="14" height="2.2" rx="1.1" fill="#6366f1" />
    <rect x="19" y="28.5" width="11" height="2.2" rx="1.1" fill="#818cf8" />
    <rect x="19" y="33" width="7" height="2" rx="1" fill="#a5b4fc" />
